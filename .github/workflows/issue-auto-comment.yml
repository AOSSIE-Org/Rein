name: Redirect new issues to Discord

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-discord-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post Discord discussion redirect
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Discussions are carried on Discord.\n\nInstead of commenting here, go to [the Discord channel](https://discord.com/channels/1022871757289422898/1467370739152846899)."
            });
